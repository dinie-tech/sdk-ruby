  /customers/{customer_id}/kyc-attachments/selfie:
    post:
      operationId: uploadKycSelfie
      summary: Upload a KYC selfie
      description: >-
        Session-only upload of a selfie for biometric validation.
        Counterpart of the polymorphic `/kyc-attachments` route, dedicated
        to selfies: `evidence_type` (`selfie`) and `attachment_type`
        (`photo`) are implicit, so the partner only supplies
        `requirement_id` (`selfie_{subject_id}`) and the `file`. Requires
        a session token bound to the customer — a partner bearer is
        denied (403), even with `kyc:upload`.
      tags:
      - Customers
      x-internal: true
      security:
      - oauth2: ["kyc:upload"]
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - requirement_id
              - file
              properties:
                requirement_id:
                  type: string
                  description: 'Format: `selfie_{subject_id}`.'
                  example: selfie_003XXXXXXXXXXXXXXX
                file:
                  type: string
                  format: binary
                  description: Binary file upload (JPEG, PNG).
              description: Selfie photo upload payload.
      responses:
        '201':
          description: Selfie slot filled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycAttachmentResponse'
              example:
                attachment_type: photo
                submitted: true
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Only a session token bound to this customer with the `kyc:upload` scope may upload a selfie — partner bearers are always denied

