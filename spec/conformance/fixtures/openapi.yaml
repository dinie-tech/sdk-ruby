  /webhooks/endpoints/{endpoint_id}/deliveries/{id}/retry:
    post:
      operationId: retryWebhookDelivery
      summary: Retry a failed webhook delivery
      description: Reset a failed delivery and re-enqueue it. Only deliveries in `failed` status can be retried.
      tags:
      - Webhooks
      parameters:
      - name: endpoint_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookEndpointId'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookDeliveryId'
      responses:
        '200':
          description: Delivery reset and re-enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '404':
          $ref: '#/components/responses/WebhookEndpointNotFound'
        '409':
          description: Delivery not retryable
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                - status
                - detail
                - code
                properties:
                  type:
                    type: string
                    const: https://docs.dinie.com/errors/conflict
                  title:
                    type: string
                    const: Conflict
                  status:
                    type: integer
                    const: 409
                  detail:
                    type: string
                  code:
                    type: string
                    const: delivery_not_retryable
              example:
                type: https://docs.dinie.com/errors/conflict
                title: Conflict
                status: 409
                detail: Only failed deliveries can be retried
                code: delivery_not_retryable
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

# ── Webhook Defaults (YAML anchors) ──────────────────────────────────────────
x-webhook-defaults:
  security: &webhook-security
  - webhookSignature: []
  parameters: &webhook-parameters
  - $ref: '#/components/parameters/WebhookId'
  - $ref: '#/components/parameters/WebhookTimestamp'
  - $ref: '#/components/parameters/WebhookSignatureHeader'
  responses: &webhook-responses
    '200':
      description: Delivery confirmed; any 2xx (200-299) is accepted
    '410':
      description: Endpoint permanently disabled, Dinie stops sending events
    '429':
      description: Rate-limiting, Dinie reduces send rate and reschedules with backoff
    '4XX':
      description: Client error (except 410, 429), failure triggers retry
    '502':
      description: Server overload, Dinie reduces send rate before retrying
    '504':
      description: Gateway timeout, Dinie reduces send rate before retrying
    '5XX':
      description: Server error (except 502, 504), failure triggers retry

