  /biometrics/session-exchange:
    post:
      operationId: exchangeBiometricsSession
      summary: Exchange a biometrics bootstrap code for a session token
      description: >-
        Internal endpoint — the kyc-app calls this with a credential that
        only has the `biometrics:exchange` scope, swapping the single-use
        bootstrap code (`dinie_bsc_…`) for a Token bound to the session's
        CreditLineApplication. The token is the bearer the wizard uses
        for every subsequent KYC request.
      tags:
      - Customers
      x-internal: true
      security:
      - oauth2: ["biometrics:exchange"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  description: The single-use bootstrap code returned by `POST /customers/{customer_id}/biometrics`.
                  example: dinie_bsc_test_abc123def456
      responses:
        '200':
          description: Session token issued
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - token_type
                - expires_in
                - customer_id
                properties:
                  access_token:
                    type: string
                    description: "Opaque session token. Use as `Authorization: Bearer …`."
                    example: dinie_at_test_abc123def456
                  token_type:
                    type: string
                    const: bearer
                  expires_in:
                    type: integer
                    description: Seconds until the issued token expires.
                    example: 3600
                  customer_id:
                    type: string
                    description: Encoded id of the customer the token is bound to.
                    example: cust_550e8400e29b41d4a716446655440000
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Credential lacks the `biometrics:exchange` scope (this endpoint is reserved for the kyc-app exchange credential)

