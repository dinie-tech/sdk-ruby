# ── Components ─────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained via OAuth2 Client Credentials (`POST /auth/token`). Expires in 1 hour.
    oauth2:
      type: oauth2
      description: >-
        OAuth2 Client Credentials flow. The credential's `allowed_scopes`
        gates which of these can be requested; the issued token inherits
        that set (down-scoping a single request is reserved for a future
        revision). Per-operation `security` lists the scopes the request
        must carry.
      flows:
        clientCredentials:
          tokenUrl: /v3/auth/token
          scopes:
            "kyc:read":           Read a customer's KYC state (requirements, attachments, status).
            "kyc:upload":         Upload a KYC attachment (document or selfie via the dedicated route).
            "kyc:submit":         Submit a customer's KYC bundle for review.
            "biometrics:create":  Mint a biometrics capture session for a customer (partner side of the handoff).
            "biometrics:exchange": Exchange a biometrics bootstrap code for a scoped session token (kyc-app side of the handoff).
    webhookSignature:
      type: apiKey
      in: header
      name: webhook-signature
      description: |
        HMAC-SHA256 signature per the Standard Webhooks specification.
        Verify using the `whsec_`-prefixed secret from endpoint creation.
        The header contains base64-encoded signatures; the signed content
        is `{webhook-id}.{webhook-timestamp}.{body}`.
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: Unique string for idempotent POST requests. Cached for 24 hours.
      schema:
        type: string
    StartingAfter:
      name: starting_after
      in: query
      description: Prefixed ID of the last item from the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 'Number of items to return. Min: 1, Max: 100.'
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    CustomerId:
      name: customer_id
      in: path
      required: true
      description: Identificador único do cliente
      schema:
        $ref: '#/components/schemas/CustomerId'
    CreditOfferId:
      name: credit_offer_id
      in: path
      required: true
      description: Identificador único da oferta de crédito
      schema:
        $ref: '#/components/schemas/CreditOfferId'
    LoanId:
      name: loan_id
      in: path
      required: true
      description: Identificador único do empréstimo
      schema:
        $ref: '#/components/schemas/LoanId'
    WebhookEndpointId:
      name: webhook_endpoint_id
      in: path
      required: true
      description: Identificador único do endpoint de webhook
      schema:
        $ref: '#/components/schemas/WebhookEndpointId'
    WebhookId:
      name: webhook-id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/EventId'
      description: Unique delivery ID. Use as idempotency key to deduplicate events.
    WebhookTimestamp:
      name: webhook-timestamp
      in: header
      required: true
      schema:
        type: integer
      description: Unix timestamp of the delivery attempt. Reject if older than 5 minutes (replay protection).
    WebhookSignatureHeader:
      name: webhook-signature
      in: header
      required: true
      schema:
        type: string
      description: HMAC-SHA256 signature(s) for verification per Standard Webhooks spec.
  responses:
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            - detail
            properties:
              type:
                type: string
                const: https://docs.dinie.com/errors/rate-limit-exceeded
              title:
                type: string
                const: Rate Limit Exceeded
              status:
                type: integer
                const: 429
              detail:
                type: string
          example:
            type: https://docs.dinie.com/errors/rate-limit-exceeded
            title: Rate Limit Exceeded
            status: 429
            detail: Too many requests. Retry after 30 seconds.
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            - detail
            properties:
              type:
                type: string
                const: https://docs.dinie.com/errors/internal
              title:
                type: string
                const: Internal Error
              status:
                type: integer
                const: 500
              detail:
                type: string
          example:
            type: https://docs.dinie.com/errors/internal
            title: Internal Error
            status: 500
            detail: An unexpected error occurred.
    WebhookEndpointNotFound:
      description: Webhook endpoint (or delivery) not found
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            - detail
            - code
            properties:
              type:
                type: string
                const: https://docs.dinie.com/errors/not-found
              title:
                type: string
                const: Not Found
              status:
                type: integer
                const: 404
              detail:
                type: string
              code:
                type: string
                const: not_found
          example:
            type: https://docs.dinie.com/errors/not-found
            title: Not Found
            status: 404
            detail: Endpoint ID does not exist or does not belong to this partner
            code: not_found
    BearerTokenUnauthorized:
      description: Authentication failed
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            - detail
            - code
            properties:
              type:
                type: string
                const: https://docs.dinie.com/errors/authentication-failed
              title:
                type: string
                const: Authentication Failed
              status:
                type: integer
                const: 401
              detail:
                type: string
              code:
                type: string
                enum:
                - missing_token
                - invalid_token
                - token_expired
                x-enumDescriptions:
                  missing_token: Authorization header is missing
                  invalid_token: Bearer token is invalid or malformed
                  token_expired: Bearer token has expired
          examples:
            missing_token:
              summary: Authorization header is missing
              value:
                type: https://docs.dinie.com/errors/authentication-failed
                title: Authentication Failed
                status: 401
                detail: Authorization header is missing
                code: missing_token
            invalid_token:
              summary: Bearer token is invalid or malformed
              value:
                type: https://docs.dinie.com/errors/authentication-failed
                title: Authentication Failed
                status: 401
                detail: Bearer token is invalid or malformed
                code: invalid_token
            token_expired:
              summary: Bearer token has expired
              value:
                type: https://docs.dinie.com/errors/authentication-failed
                title: Authentication Failed
                status: 401
                detail: Bearer token has expired
                code: token_expired
    ClientCredentialUnauthorized:
      description: Authentication failed
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            - detail
            - code
            properties:
              type:
                type: string
                const: https://docs.dinie.com/errors/authentication-failed
              title:
                type: string
                const: Authentication Failed
              status:
                type: integer
                const: 401
              detail:
                type: string
              code:
                type: string
                enum:
                - missing_authorization
                - invalid_client
                - invalid_client_secret
                - credential_revoked
                - credential_expired
                x-enumDescriptions:
                  missing_authorization: Missing client credentials
                  invalid_client: '`client_id` does not exist'
                  invalid_client_secret: '`client_secret` does not match'
                  credential_revoked: Credential has been revoked
                  credential_expired: Credential has passed its `expires_at`
          examples:
            missing_authorization:
              summary: Missing client credentials
              value:
                type: https://docs.dinie.com/errors/authentication-failed
                title: Authentication Failed
                status: 401
                detail: Missing client credentials
                code: missing_authorization
            invalid_client:
              summary: '`client_id` does not exist'
              value:
                type: https://docs.dinie.com/errors/authentication-failed
                title: Authentication Failed
                status: 401
                detail: '`client_id` does not exist'
                code: invalid_client
            invalid_client_secret:
              summary: '`client_secret` does not match'
              value:
                type: https://docs.dinie.com/errors/authentication-failed
                title: Authentication Failed
                status: 401
                detail: '`client_secret` does not match'
                code: invalid_client_secret
            credential_revoked:
              summary: Credential has been revoked
              value:
                type: https://docs.dinie.com/errors/authentication-failed
                title: Authentication Failed
                status: 401
                detail: Credential has been revoked
                code: credential_revoked
            credential_expired:
              summary: Credential has passed its `expires_at`
              value:
                type: https://docs.dinie.com/errors/authentication-failed
                title: Authentication Failed
                status: 401
                detail: Credential has passed its `expires_at`
                code: credential_expired
    Forbidden:
      description: The credential is not permitted to perform this action
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            - detail
            - code
            properties:
              type:
                type: string
                const: https://docs.dinie.com/errors/forbidden
              title:
                type: string
                const: Forbidden
              status:
                type: integer
                const: 403
              detail:
                type: string
              code:
                type: string
                const: forbidden
          examples:
            forbidden:
              summary: The credential is not permitted to perform this action
              value:
                type: https://docs.dinie.com/errors/forbidden
                title: Forbidden
                status: 403
                detail: Forbidden
                code: forbidden
  schemas:
    CustomerId:
      description: Identificador único do cliente
      type: string
      pattern: ^cust_[0-9a-f]{32}$
      example: cust_550e8400e29b41d4a716446655440000
    CreditOfferId:
      description: Identificador único da oferta de crédito
      type: string
      pattern: ^co_[0-9a-f]{32}$
      example: co_550e8400e29b41d4a716446655440000
    LoanId:
      description: Identificador único do empréstimo
      type: string
      pattern: ^ln_[0-9a-f]{32}$
      example: ln_550e8400e29b41d4a716446655440000
    TransactionId:
      description: Identificador único da transação
      type: string
      pattern: ^tx_[0-9a-f]{32}$
      example: tx_550e8400e29b41d4a716446655440000
    SimulationId:
      description: Identificador único da simulação
      type: string
      pattern: ^sim_[0-9a-f]{32}$
      example: sim_550e8400e29b41d4a716446655440000
    WebhookEndpointId:
      description: Identificador único do endpoint de webhook
      type: string
      pattern: ^we_[0-9a-f]{32}$
      example: we_550e8400e29b41d4a716446655440000
    WebhookDeliveryId:
      description: Identificador único de uma tentativa de entrega de webhook
      type: string
      pattern: ^dlv_[0-9a-f]{32}$
      example: dlv_550e8400e29b41d4a716446655440000
    ApiClientId:
      description: Identificador único da credencial de API (inclui prefixo de ambiente `live`/`test`)
      type: string
      pattern: ^dinie_ci_(live|test)_[A-Za-z0-9]+$
      example: dinie_ci_live_550e8400e29b41d4a71644
    BankAccountId:
      description: Identificador único da conta bancária
      type: string
      pattern: ^ba_[0-9a-f]{32}$
      example: ba_550e8400e29b41d4a716446655440000
    Money:
      type: number
      format: double
      description: Monetary value in BRL.
      example: 25000.00
    TokenResponse:
      description: Resposta com o token de acesso JWT
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: JWT access token
          example: dinie_at_eyJhbGciOiJIUzI1NiJ9...
        token_type:
          type: string
          description: Tipo do token retornado
          const: bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds
          example: 3600
    CreateCredentialRequest:
      description: Dados para criar uma nova credencial de API
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Human-readable label for this key
          example: Production Key
        expires_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Optional expiration date as Unix epoch seconds. Null means never expires.
          example: 1803945600
    Credential:
      description: Credencial de API do parceiro
      type: object
      required:
      - id
      - client_id
      - name
      - status
      - last_used_at
      - expires_at
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ApiClientId'
        client_id:
          $ref: '#/components/schemas/ApiClientId'
        name:
          type: string
          description: Nome legível da credencial
          example: Production Key
        status:
          type: string
          description: Estado atual da credencial
          enum:
          - active
          - revoked
        last_used_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Last time this credential was used for authentication (Unix epoch seconds).
        expires_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Expiration timestamp (Unix epoch seconds).
        created_at:
          type: integer
          format: int64
          description: When this resource was created (Unix epoch seconds).
        updated_at:
          type: integer
          format: int64
          description: When this resource was last modified (Unix epoch seconds).
    CredentialWithSecret:
      description: Returned only at creation. The `client_secret` cannot be retrieved again.
      allOf:
      - $ref: '#/components/schemas/Credential'
      - type: object
        required:
        - client_secret
        properties:
          client_secret:
            type: string
            description: Store securely -- shown only once.
            example: dinie_cs_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    CreateCustomerRequest:
      description: Dados para cadastrar um novo cliente
      type: object
      required:
      - email
      - phone
      - cpf
      - cnpj
      properties:
        external_id:
          type: string
          description: Partner external reference for this customer
          example: partner-ref-123
        name:
          type: string
          description: Optional. When omitted, auto-fetched from government records via CPF lookup.
          example: Joao Silva
        email:
          type: string
          format: email
          example: joao@example.com
        phone:
          type: string
          pattern: '^\+55\d{10,11}$'
          description: 'E.164 format — Brazilian numbers only (+55 followed by 10 or 11 digits)'
          example: '+5511999999999'
        cpf:
          type: string
          pattern: '^\d{3}\.\d{3}\.\d{3}-\d{2}$'
          description: Customer CPF (required). Accepts formatted (`123.456.789-00`) or unformatted (`12345678900`).
          example: 123.456.789-00
        cnpj:
          type: string
          pattern: '^\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}$'
          description: Company CNPJ. Accepts formatted (`12.345.678/0001-90`) or unformatted (`12345678000190`). First 12 characters are alphanumeric (A-Z, 0-9), last 2 are numeric check digits. Alphanumeric CNPJs issued from July 2026 per IN RFB 2.229/2024.
          example: '12.345.678/0001-90'
    UpdateCustomerRequest:
      description: Dados para atualizar um cliente existente
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\+55\d{10,11}$'
    Customer:
      description: Representação completa de um cliente cadastrado
      type: object
      required:
      - id
      - external_id
      - name
      - email
      - phone
      - cpf
      - cnpj
      - trading_name
      - status
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/CustomerId'
        external_id:
          type:
          - string
          - 'null'
          example: partner-ref-123
        name:
          type:
          - string
          - 'null'
          example: Joao Silva
        email:
          type: string
          format: email
          example: joao@example.com
        phone:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          example: '+5511999999999'
        cpf:
          type: string
          pattern: '^\d{3}\.\d{3}\.\d{3}-\d{2}$'
          description: Customer CPF. Always formatted as `XXX.XXX.XXX-XX` in responses.
          example: 123.456.789-00
        cnpj:
          type:
          - string
          - 'null'
          pattern: '^\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}$'
          description: Company CNPJ. Always formatted as `XX.XXX.XXX/XXXX-XX` in responses. First 12 characters are alphanumeric (A-Z, 0-9), last 2 are numeric check digits. Alphanumeric CNPJs issued from July 2026 per IN RFB 2.229/2024.
          example: '12.345.678/0001-90'
        trading_name:
          type:
          - string
          - 'null'
          example: Loja do Joao
        status:
          type: string
          enum:
          - creating
          - pending_kyc
          - under_review
          - active
          - denied
          x-enumDescriptions:
            creating: Cadastro em andamento, aguardando enriquecimento de dados
            pending_kyc: Aguardando envio dos documentos KYC
            under_review: Documentos em análise
            active: Cliente aprovado e habilitado para ofertas de crédito
            denied: Cliente negado permanentemente
        kyc:
          type: array
          description: 'KYC requirements array. Omitted during `creating` status. Present from `pending_kyc` onward.'
          items:
            $ref: '#/components/schemas/KycRequirement'
        created_at:
          type: integer
          format: int64
          description: When this resource was created (Unix epoch seconds).
        updated_at:
          type: integer
          format: int64
          description: When this resource was last modified (Unix epoch seconds).
    # ── KYC Requirement (discriminated oneOf) ──────────────────────────
    KycRequirement:
      oneOf:
      - $ref: '#/components/schemas/IdentityRequirement'
      - $ref: '#/components/schemas/SelfieRequirement'
      - $ref: '#/components/schemas/ProofOfAddressRequirement'
      - $ref: '#/components/schemas/CompanyDocumentRequirement'
      - $ref: '#/components/schemas/EiMeiDocumentsRequirement'
      - $ref: '#/components/schemas/IncomeStatementRequirement'
      - $ref: '#/components/schemas/ArticlesOfAssociationRequirement'
      - $ref: '#/components/schemas/EireliIncorporationStatementRequirement'
      - $ref: '#/components/schemas/EmailRequirement'
      discriminator:
        propertyName: requirement_type
        mapping:
          identity: '#/components/schemas/IdentityRequirement'
          selfie: '#/components/schemas/SelfieRequirement'
          proof_of_address: '#/components/schemas/ProofOfAddressRequirement'
          company_document: '#/components/schemas/CompanyDocumentRequirement'
          ei_mei_documents: '#/components/schemas/EiMeiDocumentsRequirement'
          income_statement: '#/components/schemas/IncomeStatementRequirement'
          articles_of_association: '#/components/schemas/ArticlesOfAssociationRequirement'
          eireli_incorporation_statement: '#/components/schemas/EireliIncorporationStatementRequirement'
          email: '#/components/schemas/EmailRequirement'
      description: >
        A KYC requirement — something that needs to be verified (e.g., identity, address).
        Discriminated by `requirement_type`. Person-specific requirements include a `subject` field;
        company-wide requirements do not.

    # ── Subject Models ───────────────────────────────────────────────
    KycSubject:
      type: object
      required:
      - id
      - name
      - subject_type
      properties:
        id:
          type: string
          description: Opaque identifier for this subject (used in `requirement_id` suffix and document uploads).
          example: 003XXXXXXXXXXXXXXX
        name:
          type: string
          description: Human-readable name of the subject.
          example: Joao Silva
        subject_type:
          type: string
          enum:
          - applicant
          - co_owner
          description: '`applicant` — the customer themselves. `co_owner` — a director/shareholder of the company.'
      description: Identifies who the requirement is about (a person or company co-owner).

    # ── 1. Identity Requirement ──────────────────────────────────────
    IdentityRequirement:
      type: object
      required:
      - requirement_type
      - requirement_id
      - label
      - mandatory
      - subject
      properties:
        requirement_type:
          type: string
          description: Discriminador do tipo de requisito KYC
          const: identity
        requirement_id:
          type: string
          description: 'Format: `identity_{subject_id}`'
          example: identity_003XXXXXXXXXXXXXXX
        label:
          type: string
          description: Human-readable label.
          example: Documento de identidade
        mandatory:
          type: boolean
          description: Indica se o requisito é obrigatório
        subject:
          $ref: '#/components/schemas/KycSubject'
        submitted:
          oneOf:
          - $ref: '#/components/schemas/IdentityCnhSubmitted'
          - $ref: '#/components/schemas/IdentityRgSubmitted'
          description: Evidence submitted for this requirement. Absent if nothing submitted yet.
      description: Identity document requirement (CNH or RG). Always person-specific.

    IdentityCnhSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: cnh
        attachments:
          oneOf:
          - $ref: '#/components/schemas/CnhPhysicalAttachmentSet'
          - $ref: '#/components/schemas/CnhDigitalAttachmentSet'
          description: Physical CNH (front + back photos) or digital CNH (single PDF).
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'
      description: CNH evidence — either physical (front + back) or digital (single PDF).

    CnhPhysicalAttachmentSet:
      type: array
      description: Physical CNH — front and back photos.
      minItems: 2
      maxItems: 2
      items:
        type: object
        required:
        - attachment_type
        - submitted
        properties:
          attachment_type:
            type: string
            description: Tipo do anexo da CNH física
            enum:
            - front
            - back
          submitted:
            type: boolean
            description: '`true` if this slot has been filled.'

    CnhDigitalAttachmentSet:
      type: array
      description: Digital CNH — single PDF file.
      minItems: 1
      maxItems: 1
      items:
        type: object
        required:
        - attachment_type
        - submitted
        properties:
          attachment_type:
            type: string
            description: Tipo do anexo da CNH digital
            const: file
          submitted:
            type: boolean
            description: '`true` if this slot has been filled.'

    IdentityRgSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: rg
        attachments:
          type: array
          description: RG — front and back photos.
          minItems: 2
          maxItems: 2
          items:
            type: object
            required:
            - attachment_type
            - submitted
            properties:
              attachment_type:
                type: string
                description: Tipo do anexo do RG
                enum:
                - front
                - back
              submitted:
                type: boolean
                description: '`true` if this slot has been filled.'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'
      description: RG evidence — front and back photos.

    # ── 2. Selfie Requirement ────────────────────────────────────────
    SelfieRequirement:
      type: object
      required:
      - requirement_type
      - requirement_id
      - label
      - mandatory
      - subject
      properties:
        requirement_type:
          type: string
          description: Discriminador do tipo de requisito KYC
          const: selfie
        requirement_id:
          type: string
          description: 'Format: `selfie_{subject_id}`'
          example: selfie_003XXXXXXXXXXXXXXX
        label:
          type: string
          description: Rótulo legível do requisito
          example: Selfie
        mandatory:
          type: boolean
          description: Indica se o requisito é obrigatório
        subject:
          $ref: '#/components/schemas/KycSubject'
        submitted:
          $ref: '#/components/schemas/SelfieSubmitted'
          description: Evidence submitted for this requirement. Absent if nothing submitted yet.
      description: Selfie requirement. Always person-specific.

    SelfieSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: selfie
        attachments:
          type: array
          description: Foto de selfie enviada
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - attachment_type
            - submitted
            properties:
              attachment_type:
                type: string
                description: Tipo do anexo enviado
                const: photo
              submitted:
                type: boolean
                description: '`true` se este slot já foi enviado.'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'

    # ── 3. Proof of Address Requirement ──────────────────────────────
    ProofOfAddressRequirement:
      type: object
      required:
      - requirement_type
      - requirement_id
      - label
      - mandatory
      - subject
      properties:
        requirement_type:
          type: string
          description: Discriminador do tipo de requisito KYC
          const: proof_of_address
        requirement_id:
          type: string
          description: 'Format: `proof_of_address_{subject_id}`'
          example: proof_of_address_003XXXXXXXXXXXXXXX
        label:
          type: string
          description: Rótulo legível do requisito
          example: Comprovante de endereço
        mandatory:
          type: boolean
          description: Indica se o requisito é obrigatório
        subject:
          $ref: '#/components/schemas/KycSubject'
        submitted:
          $ref: '#/components/schemas/ProofOfAddressSubmitted'
          description: Evidence submitted for this requirement. Absent if nothing submitted yet.
      description: Proof of address requirement. Always person-specific.

    ProofOfAddressSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: proof_of_address
        attachments:
          type: array
          description: Arquivo de comprovante de endereço enviado
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - attachment_type
            - submitted
            properties:
              attachment_type:
                type: string
                description: Tipo do anexo enviado
                const: file
              submitted:
                type: boolean
                description: '`true` se este slot já foi enviado.'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'

    # ── 4. Company Document Requirement ──────────────────────────────
    CompanyDocumentRequirement:
      type: object
      required:
      - requirement_type
      - requirement_id
      - label
      - mandatory
      properties:
        requirement_type:
          type: string
          description: Discriminador do tipo de requisito KYC
          const: company_document
        requirement_id:
          type: string
          description: 'Format: `company_document_{account_id}`'
          example: company_document_001XXXXXXXXXXXXXXX
        label:
          type: string
          description: Rótulo legível do requisito
          example: Documento da empresa
        mandatory:
          type: boolean
          description: Indica se o requisito é obrigatório
        submitted:
          $ref: '#/components/schemas/CompanyDocumentSubmitted'
          description: Evidence submitted for this requirement. Absent if nothing submitted yet.
      description: Company document requirement (CCMEI). No subject — applies to the customer's company.

    CompanyDocumentSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: ccmei
        attachments:
          type: array
          description: Arquivo CCMEI enviado
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - attachment_type
            - submitted
            properties:
              attachment_type:
                type: string
                description: Tipo do anexo enviado
                const: file
              submitted:
                type: boolean
                description: '`true` se este slot já foi enviado.'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'

    # ── 5. EI/MEI Documents Requirement ──────────────────────────────
    EiMeiDocumentsRequirement:
      type: object
      required:
      - requirement_type
      - requirement_id
      - label
      - mandatory
      properties:
        requirement_type:
          type: string
          description: Discriminador do tipo de requisito KYC
          const: ei_mei_documents
        requirement_id:
          type: string
          description: Identificador fixo do requisito
          const: ei_mei_documents
        label:
          type: string
          description: Rótulo legível do requisito
          example: Documentos de EI/MEI
        mandatory:
          type: boolean
          description: Indica se o requisito é obrigatório
        submitted:
          $ref: '#/components/schemas/EiMeiDocumentsSubmitted'
          description: Evidence submitted for this requirement. Absent if nothing submitted yet.
      description: EI/MEI documents requirement. Both attachments (EI registration + CCMEI) are required. No subject.

    EiMeiDocumentsSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: ei_mei
        attachments:
          type: array
          description: Both attachments are required.
          minItems: 2
          maxItems: 2
          items:
            type: object
            required:
            - attachment_type
            - submitted
            properties:
              attachment_type:
                type: string
                description: Tipo do anexo enviado
                enum:
                - ei_registration_requirement
                - ccmei
              submitted:
                type: boolean
                description: '`true` se este slot já foi enviado.'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'

    # ── 6. Income Statement Requirement ──────────────────────────────
    IncomeStatementRequirement:
      type: object
      required:
      - requirement_type
      - requirement_id
      - label
      - mandatory
      properties:
        requirement_type:
          type: string
          description: Discriminador do tipo de requisito KYC
          const: income_statement
        requirement_id:
          type: string
          description: Identificador fixo do requisito
          const: income_statement
        label:
          type: string
          description: Rótulo legível do requisito
          example: Declaração de faturamento
        mandatory:
          type: boolean
          description: Indica se o requisito é obrigatório
        submitted:
          $ref: '#/components/schemas/IncomeStatementSubmitted'
          description: Evidence submitted for this requirement. Absent if nothing submitted yet.
      description: Income statement requirement. No subject — applies to the customer's company.

    IncomeStatementSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: income_statement
        attachments:
          type: array
          description: Arquivo de declaração de faturamento enviado
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - attachment_type
            - submitted
            properties:
              attachment_type:
                type: string
                description: Tipo do anexo enviado
                const: file
              submitted:
                type: boolean
                description: '`true` se este slot já foi enviado.'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'

    # ── 7. Articles of Association Requirement ───────────────────────
    ArticlesOfAssociationRequirement:
      type: object
      required:
      - requirement_type
      - requirement_id
      - label
      - mandatory
      properties:
        requirement_type:
          type: string
          description: Discriminador do tipo de requisito KYC
          const: articles_of_association
        requirement_id:
          type: string
          description: Identificador fixo do requisito
          const: articles_of_association
        label:
          type: string
          description: Rótulo legível do requisito
          example: Contrato social
        mandatory:
          type: boolean
          description: Indica se o requisito é obrigatório
        submitted:
          $ref: '#/components/schemas/ArticlesOfAssociationSubmitted'
          description: Evidence submitted for this requirement. Absent if nothing submitted yet.
      description: Articles of association requirement. No subject — applies to the customer's company.

    ArticlesOfAssociationSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: articles_of_association
        attachments:
          type: array
          description: Arquivo de contrato social enviado
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - attachment_type
            - submitted
            properties:
              attachment_type:
                type: string
                description: Tipo do anexo enviado
                const: file
              submitted:
                type: boolean
                description: '`true` se este slot já foi enviado.'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'

    # ── 8. EIRELI Incorporation Statement Requirement ────────────────
    EireliIncorporationStatementRequirement:
      type: object
      required:
      - requirement_type
      - requirement_id
      - label
      - mandatory
      properties:
        requirement_type:
          type: string
          description: Discriminador do tipo de requisito KYC
          const: eireli_incorporation_statement
        requirement_id:
          type: string
          description: Identificador fixo do requisito
          const: eireli_incorporation_statement
        label:
          type: string
          description: Rótulo legível do requisito
          example: Ato constitutivo de EIRELI
        mandatory:
          type: boolean
          description: Indica se o requisito é obrigatório
        submitted:
          $ref: '#/components/schemas/EireliIncorporationStatementSubmitted'
          description: Evidence submitted for this requirement. Absent if nothing submitted yet.
      description: EIRELI incorporation statement requirement. No subject — applies to the customer's company.

    EireliIncorporationStatementSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: eireli_incorporation_statement
        attachments:
          type: array
          description: Arquivo do ato constitutivo de EIRELI enviado
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - attachment_type
            - submitted
            properties:
              attachment_type:
                type: string
                description: Tipo do anexo enviado
                const: file
              submitted:
                type: boolean
                description: '`true` se este slot já foi enviado.'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'

    # ── 9. Email Requirement (person-level) ───────────────────────────
    EmailRequirement:
      type: object
      required:
      - requirement_type
      - requirement_id
      - label
      - mandatory
      - subject
      properties:
        requirement_type:
          type: string
          description: Discriminador do tipo de requisito KYC
          const: email
        requirement_id:
          type: string
          description: 'Format: `email_{subject_id}`'
          example: email_003XXXXXXXXXXXXXXX
        label:
          type: string
          description: Rótulo legível do requisito
          example: Email do co-titular para assinatura da CCB
        mandatory:
          type: boolean
          description: Indica se o requisito é obrigatório
        subject:
          $ref: '#/components/schemas/KycSubject'
        submitted:
          $ref: '#/components/schemas/EmailSubmitted'
          description: Evidence submitted for this requirement. Absent if nothing submitted yet.
      description: Email collection requirement for co-owners who need to digitally sign the CCB. Always person-specific.

    EmailSubmitted:
      type: object
      required:
      - evidence_type
      - attachments
      - review_status
      - review_reason
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência submetida
          const: email
        attachments:
          type: array
          description: Email enviado para assinatura da CCB
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - attachment_type
            - submitted
            properties:
              attachment_type:
                type: string
                description: Tipo do anexo enviado
                const: email
              submitted:
                type: boolean
                description: '`true` se este slot já foi enviado.'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        review_reason:
          $ref: '#/components/schemas/ReviewReason'
      description: Email submission state. Submitted via the KYC attachment upload endpoint with `value` instead of `file`.

    # ── Shared Review Fields ─────────────────────────────────────────
    ReviewStatus:
      type: string
      enum:
      - pending
      - accepted
      - rejected
      description: '`pending` — awaiting review. `accepted` — approved. `rejected` — partner must resubmit.'

    ReviewReason:
      type:
      - string
      - 'null'
      description: 'Explanation when `review_status` is `rejected`. `null` otherwise.'

    # ── KYC Attachment Response ──────────────────────────────────────
    KycAttachmentResponse:
      type: object
      required:
      - attachment_type
      - submitted
      properties:
        attachment_type:
          type: string
          description: Echoes the slot just submitted.
          example: front
        submitted:
          type: boolean
          description: Always `true` on a successful upload — confirms the slot was filled.
      description: Confirmation that a KYC attachment slot was filled. Read the customer endpoint to see the full requirement state.

    Bank:
      type: object
      required:
      - id
      - name
      - display_name
      properties:
        id:
          type: string
          example: '001'
        name:
          type: string
          example: Banco do Brasil
        display_name:
          type: string
          example: 001 - Banco do Brasil

    CustomerBankAccountRequest:
      type: object
      required:
      - bank_id
      - kind
      - branch
      - number
      - digit
      properties:
        bank_id:
          type: string
          description: COMPE bank code; zero-padded to 3 digits when stored.
          pattern: ^\d{1,3}$
          example: '001'
        kind:
          type: string
          enum:
          - checking
          - saving
          - payment
        branch:
          type: string
          description: Branch number without the check digit; zero-padded to 4 digits when stored.
          pattern: ^\d{1,4}$
          example: '0001'
        number:
          type: string
          pattern: ^\d+$
          example: '1234567'
        digit:
          type: string
          description: Account check digit (a single digit, or "X" for some banks).
          pattern: ^[0-9Xx]$
          example: '0'

    CustomerBankAccount:
      allOf:
      - $ref: '#/components/schemas/CustomerBankAccountRequest'
      - type: object
        required:
        - id
        - bank_name
        - updated_at
        properties:
          id:
            $ref: '#/components/schemas/BankAccountId'
          bank_name:
            type: string
          updated_at:
            type: integer
            format: int64

    # ── KYC Upload Request Variants ─────────────────────────────────
    KycUploadCnh:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - file
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: cnh
        requirement_id:
          type: string
          description: 'Format: `identity_{subject_id}`.'
          example: identity_003XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: 'Physical CNH: `front` and `back`. Digital CNH: `file` (single PDF).'
          enum:
          - front
          - back
          - file
        file:
          type: string
          format: binary
          description: Binary file upload (JPEG, PNG for physical; PDF for digital).
      description: Upload a CNH (driver's license) attachment.

    KycUploadRg:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - file
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: rg
        requirement_id:
          type: string
          description: 'Format: `identity_{subject_id}`.'
          example: identity_003XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: 'RG: `front` and `back`.'
          enum:
          - front
          - back
        file:
          type: string
          format: binary
          description: Binary file upload (JPEG, PNG).
      description: Upload an RG (identity card) attachment.

    KycUploadSelfie:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - file
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: selfie
        requirement_id:
          type: string
          description: 'Format: `selfie_{subject_id}`.'
          example: selfie_003XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: Tipo do anexo
          const: photo
        file:
          type: string
          format: binary
          description: Binary file upload (JPEG, PNG).
      description: Upload a selfie photo for biometric validation.

    KycUploadProofOfAddress:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - file
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: proof_of_address
        requirement_id:
          type: string
          description: 'Format: `proof_of_address_{subject_id}`.'
          example: proof_of_address_003XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: Tipo do anexo
          const: file
        file:
          type: string
          format: binary
          description: Binary file upload (PDF, JPEG, PNG).
      description: Upload a proof of address document.

    KycUploadCcmei:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - file
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: ccmei
        requirement_id:
          type: string
          description: 'Format: `company_document_{account_id}`.'
          pattern: '^company_document_.+$'
          example: company_document_001XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: Tipo do anexo
          const: file
        file:
          type: string
          format: binary
          description: Binary file upload (PDF, JPEG, PNG).
      description: Upload a CCMEI (Certificado da Condição de Microempreendedor Individual).

    KycUploadEiMei:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - file
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: ei_mei
        requirement_id:
          type: string
          description: Identificador do requisito de documentos EI/MEI
          pattern: '^ei_mei_documents_.+$'
          example: ei_mei_documents_001XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: 'Two documents required: `ei_registration_requirement` and `ccmei`.'
          enum:
          - ei_registration_requirement
          - ccmei
        file:
          type: string
          format: binary
          description: Binary file upload (PDF, JPEG, PNG).
      description: Upload an EI/MEI document (registration requirement or CCMEI).

    KycUploadIncomeStatement:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - file
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: income_statement
        requirement_id:
          type: string
          description: Identificador do requisito de declaração de faturamento
          pattern: '^income_statement_.+$'
          example: income_statement_001XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: Tipo do anexo
          const: file
        file:
          type: string
          format: binary
          description: Binary file upload (PDF, JPEG, PNG).
      description: Upload an income statement (DRE).

    KycUploadArticlesOfAssociation:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - file
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: articles_of_association
        requirement_id:
          type: string
          description: Identificador do requisito de contrato social
          pattern: '^articles_of_association_.+$'
          example: articles_of_association_001XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: Tipo do anexo
          const: file
        file:
          type: string
          format: binary
          description: Binary file upload (PDF, JPEG, PNG).
      description: Upload articles of association (contrato social).

    KycUploadEireliIncorporation:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - file
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: eireli_incorporation_statement
        requirement_id:
          type: string
          description: Identificador do requisito de ato constitutivo de EIRELI
          pattern: '^eireli_incorporation_statement_.+$'
          example: eireli_incorporation_statement_001XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: Tipo do anexo
          const: file
        file:
          type: string
          format: binary
          description: Binary file upload (PDF, JPEG, PNG).
      description: Upload an EIRELI incorporation statement (ato constitutivo).

    KycUploadEmail:
      type: object
      required:
      - evidence_type
      - requirement_id
      - attachment_type
      - value
      properties:
        evidence_type:
          type: string
          description: Tipo de evidência a ser enviada
          const: email
        requirement_id:
          type: string
          description: 'Format: `email_{subject_id}`.'
          example: email_003XXXXXXXXXXXXXXX
        attachment_type:
          type: string
          description: Tipo do anexo
          const: email
        value:
          type: string
          format: email
          description: Email address for the co-owner (used for CCB digital signature).
          example: co-owner@example.com
      description: Submit a co-owner email address for CCB signature.

    BiometricsSession:
      description: Sessão de biometria para validação de identidade
      type: object
      required:
      - session_url
      - expires_at
      properties:
        session_url:
          type: string
          format: uri
          description: URL for the partner to embed in their flow (webview or redirect)
          example: https://biometrics.dinie.com.br/session/...
        expires_at:
          type: integer
          format: int64
          example: 1772748000
          description: Expiration timestamp (Unix epoch seconds).
    CreditOffer:
      description: Oferta de crédito pré-aprovada para um cliente
      oneOf:
      - $ref: '#/components/schemas/FixedInstallmentCreditOffer'
      - $ref: '#/components/schemas/RangeInstallmentCreditOffer'
    CreditOfferBase:
      description: Campos comuns a toda oferta de crédito
      type: object
      required:
      - id
      - customer_id
      - status
      - approved_amount
      - min_amount
      - monthly_interest_rate
      - valid_until
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/CreditOfferId'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
        external_id:
          type: string
          description: Partner reference ID for the customer this offer belongs to
        status:
          type: string
          enum:
          - available
          - accepted
          - expired
          x-enumDescriptions:
            available: Oferta disponível para contratação
            accepted: Oferta aceita e empréstimo criado
            expired: Oferta expirada e não mais disponível
        approved_amount:
          $ref: '#/components/schemas/Money'
        min_amount:
          type: number
          format: double
          description: Minimum withdrawal amount
          example: 200.00
        monthly_interest_rate:
          type: number
          format: double
          description: Monthly interest rate percentage
          example: 3.50
        due_date_rule:
          type:
          - string
          - 'null'
          description: Due date rule for installments. Pending Core implementation.
        valid_until:
          type: integer
          format: int64
          example: 1775253599
          description: Offer expiration timestamp (Unix epoch seconds).
        created_at:
          type: integer
          format: int64
          description: When this resource was created (Unix epoch seconds).
        updated_at:
          type: integer
          format: int64
          description: When this resource was last modified (Unix epoch seconds).
    FixedInstallmentCreditOffer:
      description: Oferta de crédito com número fixo de parcelas
      allOf:
      - $ref: '#/components/schemas/CreditOfferBase'
      - type: object
        required:
        - installments
        properties:
          installments:
            type: integer
            description: Number of installments for a fixed-term offer
            example: 12
      example:
        id: co_550e8400e29b41d4a716446655440000
        customer_id: cust_550e8400e29b41d4a716446655440000
        external_id: partner-ref-123
        status: available
        approved_amount: 50000.00
        min_amount: 200.00
        monthly_interest_rate: 3.50
        installments: 12
        due_date_rule: null
        valid_until: 1775253599
        created_at: 1772791200
        updated_at: 1772877600
    RangeInstallmentCreditOffer:
      description: Oferta de crédito com faixa de parcelas selecionável pelo cliente
      allOf:
      - $ref: '#/components/schemas/CreditOfferBase'
      - type: object
        required:
        - min_installments
        - max_installments
        properties:
          min_installments:
            type: integer
            description: Minimum number of installments the customer may select
            example: 3
          max_installments:
            type: integer
            description: Maximum number of installments the customer may select
            example: 12
      example:
        id: co_660f9500f30c52e5b827557766551111
        customer_id: cust_550e8400e29b41d4a716446655440000
        external_id: partner-ref-456
        status: available
        approved_amount: 50000.00
        min_amount: 200.00
        monthly_interest_rate: 3.50
        min_installments: 3
        max_installments: 12
        due_date_rule: null
        valid_until: 1775253599
        created_at: 1772791200
        updated_at: 1772877600
    CreateSimulationRequest:
      description: Dados para criar uma simulação de empréstimo
      type: object
      required:
      - requested_amount
      - installment_count
      properties:
        requested_amount:
          type: number
          format: double
          description: Requested loan amount
          example: 25000.00
        installment_count:
          type: integer
          minimum: 1
          description: Number of installments for the simulation
          example: 12
    Simulation:
      description: Resultado de uma simulação de empréstimo com valores calculados
      type: object
      required:
      - id
      - credit_offer_id
      - requested_amount
      - principal_amount
      - interest_amount
      - iof_amount
      - total_amount
      - monthly_interest_rate
      - annual_interest_rate
      - monthly_cet_rate
      - annual_cet_rate
      - installment_count
      - installment_amount
      - fee_amount
      - first_due_date
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/SimulationId'
        credit_offer_id:
          $ref: '#/components/schemas/CreditOfferId'
        requested_amount:
          type: number
          format: double
          description: Amount requested by the partner
          example: 25000.00
        principal_amount:
          type: number
          format: double
          description: Principal amount (requested amount + financed fees)
          example: 29375.00
        interest_amount:
          type: number
          format: double
          description: Total interest amount
          example: 2614.36
        iof_amount:
          type: number
          format: double
          description: IOF tax amount
          example: 1875.00
        fee_amount:
          type: number
          format: double
          description: Fee amount (TC - Taxa de Cadastro)
          example: 2500.00
        total_amount:
          type: number
          format: double
          description: Total amount (sum of all installments)
          example: 31989.36
        monthly_interest_rate:
          type: number
          format: double
          description: Monthly interest rate (percentage)
          example: 3.50
        annual_interest_rate:
          type: number
          format: double
          description: Annual interest rate (percentage, compounded from monthly)
          example: 51.11
        monthly_cet_rate:
          type: number
          format: double
          description: Monthly total effective cost (percentage)
          example: 2.00
        annual_cet_rate:
          type: number
          format: double
          description: Annual total effective cost (percentage)
          example: 233.18
        installment_count:
          type: integer
          description: Number of installments
          example: 4
        installment_amount:
          type: number
          format: double
          description: Installment amount
          example: 7997.34
        first_due_date:
          type: string
          format: date
          description: First installment due date.
          example: '2026-04-03'
        created_at:
          type: integer
          format: int64
          description: When this resource was created (Unix epoch seconds).
    CreateLoanRequest:
      description: Dados para criar um empréstimo a partir de uma oferta de crédito
      type: object
      required:
      - credit_offer_id
      - simulation_id
      - installment_count
      - installment_amount
      - first_due_date
      properties:
        credit_offer_id:
          $ref: '#/components/schemas/CreditOfferId'
        simulation_id:
          $ref: '#/components/schemas/SimulationId'
        installment_count:
          type: integer
          minimum: 1
          description: Number of installments
          example: 4
        installment_amount:
          type: number
          format: double
          description: Installment amount
          example: 7997.34
        first_due_date:
          type: string
          format: date
          description: First installment due date.
          example: '2026-04-03'
    Loan:
      description: Representação completa de um empréstimo
      type: object
      required:
      - id
      - credit_offer_id
      - customer_id
      - simulation_id
      - status
      - requested_amount
      - principal_amount
      - iof_amount
      - monthly_interest_rate
      - annual_interest_rate
      - monthly_cet_rate
      - annual_cet_rate
      - total_amount
      - installment_count
      - installment_amount
      - first_due_date
      - ccb_number
      - disbursement_method
      - signing_url
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/LoanId'
        credit_offer_id:
          $ref: '#/components/schemas/CreditOfferId'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
        simulation_id:
          $ref: '#/components/schemas/SimulationId'
        status:
          type: string
          enum:
          - awaiting_signatures
          - processing
          - active
          - finished
          - cancelled
          - error
          x-enumDescriptions:
            awaiting_signatures: Aguardando assinaturas da CCB
            processing: Assinaturas coletadas, desembolso em andamento
            active: Empréstimo ativo com parcelas em aberto
            finished: Todas as parcelas pagas
            cancelled: Empréstimo cancelado antes do desembolso
            error: Erro durante o processamento do empréstimo
        requested_amount:
          $ref: '#/components/schemas/Money'
        principal_amount:
          type:
          - number
          - 'null'
          format: double
          description: Principal amount (requested + financed fees). Null until calculated.
        iof_amount:
          type:
          - number
          - 'null'
          format: double
        monthly_interest_rate:
          type: number
          format: double
          description: Monthly interest rate (percentage)
        annual_interest_rate:
          type: number
          format: double
          description: Annual interest rate (percentage, compounded from monthly)
        monthly_cet_rate:
          type: number
          format: double
          description: Monthly total effective cost (percentage)
        annual_cet_rate:
          type: number
          format: double
          description: Annual total effective cost (percentage)
        total_amount:
          $ref: '#/components/schemas/Money'
        installment_count:
          type: integer
        installment_amount:
          type: number
          format: double
          description: Installment amount
          example: 7997.34
        first_due_date:
          type: string
          format: date
          description: First installment due date.
          example: '2026-04-03'
        ccb_number:
          type:
          - string
          - 'null'
          description: CCB contract number. Null until the contract is generated.
        disbursement_method:
          type:
          - string
          - 'null'
          description: 'Disbursement method (e.g., `pix`). Null until disbursement.'
        signing_url:
          type:
          - string
          - 'null'
          format: uri
          description: ClickSign widget URL. Present only during `awaiting_signatures` status.
        created_at:
          type: integer
          format: int64
          description: When this resource was created (Unix epoch seconds).
        updated_at:
          type: integer
          format: int64
          description: When this resource was last modified (Unix epoch seconds).
    Transaction:
      description: Parcela de um empréstimo com valores e status de pagamento
      type: object
      required:
      - id
      - loan_id
      - type
      - status
      - due_date
      - amount_due
      - amount_paid
      - amount_remaining
      - principal
      - interest
      - fees
      - days_overdue
      - paid_at
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        loan_id:
          $ref: '#/components/schemas/LoanId'
        type:
          type: string
          const: installment
        status:
          type: string
          enum:
          - pending
          - paid
          - overdue
          - partially_paid
          x-enumDescriptions:
            pending: Parcela aguardando pagamento
            paid: Parcela paga integralmente
            overdue: Parcela vencida
            partially_paid: Parcela com pagamento parcial
        due_date:
          type: string
          format: date
          example: '2026-04-03'
          description: Installment due date.
        amount_due:
          $ref: '#/components/schemas/Money'
        amount_paid:
          $ref: '#/components/schemas/Money'
        amount_remaining:
          $ref: '#/components/schemas/Money'
        principal:
          $ref: '#/components/schemas/Money'
        interest:
          $ref: '#/components/schemas/Money'
        fees:
          $ref: '#/components/schemas/Money'
        days_overdue:
          type: integer
          minimum: 0
        paid_at:
          type:
          - integer
          - 'null'
          format: int64
          description: When payment was received (Unix epoch seconds).
        created_at:
          type: integer
          format: int64
          description: When this resource was created (Unix epoch seconds).
        updated_at:
          type: integer
          format: int64
          description: When this resource was last modified (Unix epoch seconds).
    CreateWebhookEndpointRequest:
      description: Dados para criar um novo endpoint de webhook
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL to receive webhook deliveries
          example: https://partner.example.com/webhooks/dinie
        events:
          type: array
          items:
            type: string
          description: 'Event types to subscribe to. Supports wildcards `*` (e.g., `loan.*`). Empty or omitted = all events.'
          example:
          - customer.active
          - credit_offer.available
          - loan.*
        description:
          type: string
          description: Optional human-readable description
          example: Production webhook
    UpdateWebhookEndpointRequest:
      description: Dados para atualizar um endpoint de webhook
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL HTTPS para receber as entregas de webhook
        events:
          type: array
          items:
            type: string
          description: Tipos de eventos inscritos, suporta wildcards `*`
        description:
          type: string
          description: Optional human-readable description for this endpoint
        status:
          type: string
          description: Ativa ou desativa o endpoint
          enum:
          - active
          - disabled
    WebhookEndpoint:
      description: Endpoint configurado para receber notificações de eventos
      type: object
      required:
      - id
      - url
      - events
      - description
      - status
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/WebhookEndpointId'
        url:
          type: string
          format: uri
          description: URL HTTPS configurada para receber eventos
        events:
          type: array
          items:
            type: string
          description: Lista de tipos de eventos inscritos
        description:
          type: string
          description: Human-readable description for this endpoint
        status:
          type: string
          description: Estado atual do endpoint
          enum:
          - active
          - disabled
          x-enumDescriptions:
            active: Endpoint ativo, recebendo eventos
            disabled: Endpoint desativado, sem entregas
        created_at:
          type: integer
          format: int64
          description: When this resource was created (Unix epoch seconds).
        updated_at:
          type: integer
          format: int64
          description: When this resource was last modified (Unix epoch seconds).
    WebhookEndpointWithSecret:
      description: Returned only at creation. The `secret` cannot be retrieved again.
      allOf:
      - $ref: '#/components/schemas/WebhookEndpoint'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            description: HMAC signing secret (prefix `whsec_`). Store securely -- shown only once.
            example: whsec_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    WebhookDelivery:
      description: Registro de uma tentativa de entrega de webhook
      type: object
      required:
      - id
      - event_type
      - status
      - attempt_count
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/WebhookDeliveryId'
        event_type:
          type: string
          description: Tipo de evento desta entrega
        status:
          type: string
          enum:
          - pending
          - delivered
          - failed
        response_status:
          type:
          - integer
          - 'null'
          description: HTTP status code from the last delivery attempt (if any)
        attempt_count:
          type: integer
          description: Número de tentativas já executadas
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
        failed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    WebhookSecretRotation:
      description: Resultado da rotação do segredo de assinatura do webhook
      type: object
      required:
      - id
      - secret
      - previous_secret_expires_at
      properties:
        id:
          $ref: '#/components/schemas/WebhookEndpointId'
        secret:
          type: string
          description: New HMAC signing secret
          example: whsec_yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
        previous_secret_expires_at:
          type: integer
          format: int64
          description: When the old secret stops being included in signatures (Unix epoch seconds).
    EventId:
      description: Identificador único do evento de webhook
      type: string
      pattern: ^evt_[0-9a-f]{32}$
      example: evt_550e8400e29b41d4a716446655440000
    WebhookEventBase:
      type: object
      required:
      - id
      - type
      - api_version
      - created_at
      - delivery_id
      - timestamp
      description: Standard Webhooks envelope delivered with `webhook-id`, `webhook-timestamp`, `webhook-signature` headers.
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        type:
          type: string
          description: Event type identifier
        api_version:
          type: string
          description: API version used to generate this event
          example: '2026-03-01'
        created_at:
          type: integer
          format: int64
          description: When the event was created (Unix epoch seconds)
        delivery_id:
          type: string
          description: Unique delivery attempt identifier
        timestamp:
          type: integer
          format: int64
          description: When the event occurred (Unix epoch seconds).
    WebhookEvent_CustomerCreated:
      description: Fires after co-owner enrichment completes and KYC requirements are populated. Customer is at `pending_kyc` status.
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            const: customer.created
          data:
            type: object
            description: Dados do cliente criado
            required:
            - id
            - external_id
            - name
            - email
            - phone
            - cpf
            - trading_name
            - status
            - kyc
            properties:
              id:
                $ref: '#/components/schemas/CustomerId'
              external_id:
                type:
                - string
                - 'null'
              name:
                type: string
              email:
                type: string
              phone:
                type: string
              cpf:
                type: string
              cnpj:
                type:
                - string
                - 'null'
              trading_name:
                type: string
              status:
                type: string
                const: pending_kyc
              kyc:
                type: array
                description: KYC requirements populated after enrichment
                items:
                  $ref: '#/components/schemas/KycRequirement'
    WebhookEvent_CustomerStatus:
      description: Used for `customer.under_review` and `customer.active` events.
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            enum:
            - customer.under_review
            - customer.active
          data:
            type: object
            description: Dados da mudança de status do cliente
            required:
            - id
            - external_id
            - status
            properties:
              id:
                $ref: '#/components/schemas/CustomerId'
              external_id:
                type:
                - string
                - 'null'
              status:
                type: string
                enum:
                - under_review
                - active
    WebhookEvent_CustomerDenied:
      description: Fires when the customer is permanently blocked (fraud, closed company, or other terminal condition).
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            const: customer.denied
          data:
            type: object
            description: Dados do cliente negado
            required:
            - id
            - external_id
            - name
            - email
            - phone
            - cpf
            - status
            properties:
              id:
                $ref: '#/components/schemas/CustomerId'
              external_id:
                type:
                - string
                - 'null'
              name:
                type: string
              email:
                type: string
              phone:
                type: string
              cpf:
                type: string
              cnpj:
                type:
                - string
                - 'null'
              status:
                type: string
                const: denied
    WebhookEvent_CustomerKycUpdated:
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            const: customer.kyc_updated
          data:
            type: object
            description: Dados da atualização de KYC do cliente
            required:
            - id
            - external_id
            - status
            - kyc
            properties:
              id:
                $ref: '#/components/schemas/CustomerId'
              external_id:
                type:
                - string
                - 'null'
              status:
                type: string
                enum:
                - pending_kyc
                - under_review
                - active
              kyc:
                type: array
                description: Full current state of all KYC requirements
                items:
                  $ref: '#/components/schemas/KycRequirement'
    WebhookEvent_CreditOffer:
      description: Used for `credit_offer.available` and `credit_offer.expired` events.
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            enum:
            - credit_offer.available
            - credit_offer.expired
          data:
            type: object
            description: Dados da oferta de crédito
            required:
            - id
            - customer_id
            - external_id
            - status
            - approved_amount
            - min_amount
            - monthly_interest_rate
            - installments
            - valid_until
            properties:
              id:
                $ref: '#/components/schemas/CreditOfferId'
              customer_id:
                $ref: '#/components/schemas/CustomerId'
              external_id:
                type:
                - string
                - 'null'
                description: Partner external reference for this customer
                example: partner-ref-123
              status:
                type: string
                enum:
                - available
                - expired
              approved_amount:
                $ref: '#/components/schemas/Money'
              min_amount:
                type: number
                format: double
                description: Minimum withdrawal amount
              monthly_interest_rate:
                type: number
                format: double
                description: Monthly interest rate percentage
              installments:
                type: integer
                description: Number of installments
              due_date_rule:
                type:
                - string
                - 'null'
                description: Due date rule for installments. Pending Core implementation.
              valid_until:
                type: integer
                format: int64
                description: Offer expiration timestamp (Unix epoch seconds).
    WebhookEvent_LoanCreated:
      description: Fires when the loan is created with CCB generated synchronously. Loan starts in `awaiting_signatures` status.
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            const: loan.created
          data:
            type: object
            description: Dados do empréstimo criado
            required:
            - id
            - credit_offer_id
            - customer_id
            - status
            - requested_amount
            - installment_count
            - signing_url
            properties:
              id:
                $ref: '#/components/schemas/LoanId'
              credit_offer_id:
                $ref: '#/components/schemas/CreditOfferId'
              customer_id:
                $ref: '#/components/schemas/CustomerId'
              status:
                type: string
                const: awaiting_signatures
              requested_amount:
                $ref: '#/components/schemas/Money'
              installment_count:
                type: integer
              signing_url:
                type: string
                format: uri
                description: ClickSign widget URL for customer signing
    WebhookEvent_LoanSignatureReceived:
      description: Fires each time an individual signer completes their signature on the CCB contract.
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            const: loan.signature_received
          data:
            type: object
            description: Dados da assinatura recebida
            required:
            - id
            - status
            - signer
            - signatures_received
            - signatures_required
            properties:
              id:
                $ref: '#/components/schemas/LoanId'
              status:
                type: string
                const: awaiting_signatures
              signer:
                type: object
                required:
                - name
                - cpf
                - signed_at
                properties:
                  name:
                    type: string
                    description: Nome do signatário
                  cpf:
                    type: string
                    description: CPF do signatário
                  signed_at:
                    type: integer
                    format: int64
                    description: When the signature was captured (Unix epoch seconds).
              signatures_received:
                type: integer
                description: Number of signatures collected so far
              signatures_required:
                type: integer
                description: Total number of signatures required
    WebhookEvent_LoanProcessing:
      description: Fires when all required signatures are collected and disbursement is in progress.
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            const: loan.processing
          data:
            type: object
            description: Dados do empréstimo em processamento
            required:
            - id
            - credit_offer_id
            - customer_id
            - status
            - ccb_number
            - disbursement_method
            properties:
              id:
                $ref: '#/components/schemas/LoanId'
              credit_offer_id:
                $ref: '#/components/schemas/CreditOfferId'
              customer_id:
                $ref: '#/components/schemas/CustomerId'
              status:
                type: string
                const: processing
              ccb_number:
                type: string
                description: CCB contract number
              disbursement_method:
                type: string
                description: 'Disbursement method (e.g., `pix`)'
    WebhookEvent_LoanActive:
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            const: loan.active
          data:
            type: object
            description: Dados do empréstimo ativo
            required:
            - id
            - status
            - requested_amount
            - principal_amount
            properties:
              id:
                $ref: '#/components/schemas/LoanId'
              status:
                type: string
                const: active
              requested_amount:
                $ref: '#/components/schemas/Money'
              principal_amount:
                $ref: '#/components/schemas/Money'
    WebhookEvent_LoanPaymentReceived:
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            const: loan.payment_received
          data:
            type: object
            description: Dados do pagamento recebido
            required:
            - id
            - status
            - payment
            properties:
              id:
                $ref: '#/components/schemas/LoanId'
              status:
                type: string
                const: active
              payment:
                type: object
                required:
                - amount
                - paid_at
                - installment_number
                properties:
                  amount:
                    $ref: '#/components/schemas/Money'
                  paid_at:
                    type: integer
                    format: int64
                    description: When payment was received (Unix epoch seconds).
                  installment_number:
                    type: integer
                    description: Número da parcela paga
    WebhookEvent_LoanStatus:
      description: Used for `loan.finished`, `loan.cancelled`, and `loan.error` events.
      allOf:
      - $ref: '#/components/schemas/WebhookEventBase'
      - type: object
        properties:
          type:
            type: string
            description: Tipo do evento
            enum:
            - loan.finished
            - loan.cancelled
            - loan.error
          data:
            type: object
            description: Dados da mudança de status do empréstimo
            required:
            - id
            - status
            properties:
              id:
                $ref: '#/components/schemas/LoanId'
              status:
                type: string
                enum:
                - finished
                - cancelled
                - error
              error:
                type: object
                description: Error details. Present only for `loan.error` events.
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Machine-readable error code
                  message:
                    type: string
                    description: Human-readable error description
