AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false

# Development dependencies live in the gemspec (story 001 scaffold), not the Gemfile.
Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# Double quotes throughout — matches the `bundle gem` scaffold convention.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Scaffold modules document themselves via YARD on public API in later stories.
Style/Documentation:
  Enabled: false

# RSpec blocks, the gemspec, and the Rakefile grow naturally; length caps add noise.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
    - "Rakefile"

# The generated layer is deterministic, verbose-by-design emission: per-field (de)serializers
# list every attribute explicitly (R-EXPLICIT, architecture §6). Method-length / ABC caps
# fight that intent and add noise; the layer is bot-owned (CODEOWNERS) and regenerated
# wholesale in V0.5.
Metrics/MethodLength:
  Exclude:
    - "lib/dinie/generated/**/*"
Metrics/AbcSize:
  Exclude:
    - "lib/dinie/generated/**/*"
# Request serializers take one keyword argument per request-body field (RB4); the kwargs ARE
# the API and are self-documenting at the call site, so the >5 cap does not apply here.
Metrics/ParameterLists:
  Exclude:
    - "lib/dinie/generated/**/*"
# Discriminated-union dispatches (KYC requirement/upload — story 009; webhook events — story 011)
# are table-driven `case/when` over the openapi `discriminator.mapping`: inherently high branch
# count, mechanical, and template-emittable by the V0.4 generator. Same relaxed Metrics bar as the
# rest of the generated layer (not hand-tuned control flow).
Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/dinie/generated/**/*"
Metrics/PerceivedComplexity:
  Exclude:
    - "lib/dinie/generated/**/*"

# The generator emits YARD docstrings verbatim (no line-wrapping) from the real spec.
# Some descriptions exceed 120 chars. Scoped to the generated dir and test files (L10/lessons.md).
Layout/LineLength:
  Exclude:
    - "lib/dinie/generated/**/*"
    - "spec/**/*"

# Generated dispatch tables (e.g. credit_offer discriminator) legitimately repeat branches.
Lint/DuplicateBranch:
  Exclude:
    - "lib/dinie/generated/**/*"
