name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: rubocop · rspec · steep (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs `bundle install` and caches gems

      - name: RuboCop
        run: bundle exec rubocop

      - name: RSpec
        run: bundle exec rspec

      # Steep runs against the full RBS mirror in `sig/` (story 013). It is INFORMATIVE
      # (non-blocking) in v1 — §21.3 decision, confirmed in story 013: the public surface + runtime
      # type-check, and the bounded residual is Steep's static-analysis limits against idiomatic
      # Ruby (the `**fields` splat idiom + stdlib empty-collection inference), NOT type errors. See
      # the Steepfile header for the residual breakdown and the promotion-to-blocking path. No
      # `sdk-generator --check` here — the generator is V0.4.
      - name: Steep (informative)
        run: bundle exec steep check
        continue-on-error: true
